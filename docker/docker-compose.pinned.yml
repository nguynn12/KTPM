# Pinned compose — Paperless-ngx v3.1.3 (TV1)
# Bản sao docker-compose.yml của nhóm, chỉ thêm dòng env_file `docker-compose.env`
# để tách riêng phần cấu hình Paperless (sinh từ docker/docker-compose.env.example).
# Đã kiểm chứng thực tế trên máy TV1 ngày 13/10/2026 (3/3 container Up, webserver healthy):
#   broker    -> docker.io/library/redis:7-alpine
#   db        -> docker.io/library/postgres:16-alpine
#   webserver -> ghcr.io/paperless-ngx/paperless-ngx:3.1.3
# Cách dùng: cp docker/docker-compose.pinned.yml docker-compose.yml

services:
  broker:
    image: redis:7-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file:
      - .env
      - docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless

volumes:
  data:
  media:
  pgdata:
  redisdata:
