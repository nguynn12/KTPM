<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1976d2" flood-opacity="0.3"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1976d2"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00796b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d32f2f"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#546e7a"/>
    </marker>
  </defs>

  <!-- BACKGROUND & HEADER -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8fafc"/>
  
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b"/>
  <text x="600" y="32" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="0.5">
    HÌNH 1: SƠ ĐỒ KIẾN TRÚC CONTAINER HỆ THỐNG PAPERLESS-NGX
  </text>
  <text x="600" y="54" text-anchor="middle" fill="#94a3b8" font-size="13">
    Đề tài R08 + K05: Kiểm thử API tự động với Schemathesis · Môi trường Docker Compose (3 Services)
  </text>

  <!-- ==================== KHỐI BÊN NGOÀI: CLIENTS ==================== -->
  <g id="clients">
    <rect x="40" y="100" width="220" height="660" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
    <rect x="40" y="100" width="220" height="40" rx="12" fill="#e2e8f0"/>
    <text x="150" y="126" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">CLIENTS / KIỂM THỬ</text>

    <!-- Client 1: Web Browser -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="180" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#3b82f6"/>
      <text x="90" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">🌐 TRÌNH DUYỆT (UI)</text>
      <text x="90" y="55" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Angular Web Frontend</text>
      <text x="90" y="75" text-anchor="middle" fill="#475569" font-size="11">• Người dùng tải tài liệu</text>
      <text x="90" y="93" text-anchor="middle" fill="#475569" font-size="11">• Quản lý Tag, Nhãn, Loại</text>
      <text x="90" y="111" text-anchor="middle" fill="#475569" font-size="11">• Tìm kiếm và xem trước</text>
      <rect x="25" y="123" width="130" height="18" rx="4" fill="#dbeafe"/>
      <text x="90" y="136" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">http://localhost:8000</text>
    </g>

    <!-- Client 2: Schemathesis QA -->
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="180" height="180" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#a855f7"/>
      <text x="90" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">⚙️ SCHEMATHESIS (QA)</text>
      <text x="90" y="55" text-anchor="middle" fill="#7e22ce" font-size="12" font-weight="bold">API Fuzzing / Kiểm thử</text>
      <text x="90" y="75" text-anchor="middle" fill="#475569" font-size="11">• TV4 (Seed: 404)</text>
      <text x="90" y="93" text-anchor="middle" fill="#475569" font-size="11">• V1: GET (19 ops)</text>
      <text x="90" y="111" text-anchor="middle" fill="#475569" font-size="11">• V2: CRUD (18 ops)</text>
      <text x="90" y="129" text-anchor="middle" fill="#475569" font-size="11">• V3: Toàn diện (53 ops)</text>
      <rect x="15" y="145" width="150" height="22" rx="4" fill="#f3e8ff"/>
      <text x="90" y="160" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">Authorization: Token [Token]</text>
    </g>

    <!-- Client 3: Swagger UI / cURL -->
    <g transform="translate(60, 545)">
      <rect x="0" y="0" width="180" height="120" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#22c55e"/>
      <text x="90" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">📄 SWAGGER UI / cURL</text>
      <text x="90" y="55" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">OpenAPI Schema Viewer</text>
      <text x="90" y="75" text-anchor="middle" fill="#475569" font-size="11">• /api/schema/</text>
      <text x="90" y="93" text-anchor="middle" fill="#475569" font-size="11">• Tái hiện BUG-01..06</text>
      <rect x="20" y="100" width="140" height="15" rx="3" fill="#dcfce7"/>
      <text x="90" y="111" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">163 Operations Total</text>
    </g>
  </g>

  <!-- ==================== KHỐI DOCKER COMPOSE NETWORK ==================== -->
  <g id="docker-network">
    <rect x="290" y="100" width="580" height="660" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="290" y="100" width="580" height="40" rx="12" fill="#0284c7"/>
    <text x="580" y="126" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">
      🐳 DOCKER COMPOSE ENVIRONMENT (Bridge Network: ktpm_default)
    </text>

    <!-- CONTAINER 1: paperless-webserver -->
    <g transform="translate(315, 160)">
      <rect x="0" y="0" width="530" height="270" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="530" height="36" rx="10" fill="#2563eb"/>
      <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="bold">📦 Container 1: paperless-webserver</text>
      <rect x="350" y="8" width="165" height="20" rx="4" fill="#1d4ed8"/>
      <text x="432" y="22" text-anchor="middle" fill="#ffffff" font-size="11">ghcr.io/...:3.1.3 (Host: 8000)</text>

      <!-- Sub-module 1: Django Backend -->
      <g transform="translate(15, 48)">
        <rect x="0" y="0" width="240" height="110" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
        <text x="120" y="22" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">Django REST API Server</text>
        <text x="15" y="44" fill="#334155" font-size="11">• Giao thức: HTTP / REST</text>
        <text x="15" y="62" fill="#334155" font-size="11">• ViewSets: Tag, Corr, Doc, Type</text>
        <text x="15" y="80" fill="#334155" font-size="11">• Serializer &amp; Validation</text>
        <text x="15" y="98" fill="#334155" font-size="11">• OpenAPI Schema Generator</text>
      </g>

      <!-- Sub-module 2: Celery Worker & OCR -->
      <g transform="translate(275, 48)">
        <rect x="0" y="0" width="240" height="110" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="120" y="22" text-anchor="middle" fill="#b45309" font-size="12" font-weight="bold">Celery Worker / Xử lý ngầm</text>
        <text x="15" y="44" fill="#334155" font-size="11">• Tiêu thụ task từ Redis</text>
        <text x="15" y="62" fill="#334155" font-size="11">• Engine OCR: OCRmyPDF</text>
        <text x="15" y="80" fill="#334155" font-size="11">• Nhận diện ký tự Tesseract</text>
        <text x="15" y="98" fill="#334155" font-size="11">• Trích xuất nội dung văn bản</text>
      </g>

      <!-- Sub-module 3: Search & Document Processing -->
      <g transform="translate(15, 170)">
        <rect x="0" y="0" width="500" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="250" y="20" text-anchor="middle" fill="#334155" font-size="12" font-weight="bold">Cơ chế quản lý và lập chỉ mục nội bộ</text>
        <text x="20" y="42" fill="#475569" font-size="11">🔍 Whoosh Full-text Index: Lập chỉ mục nội dung trích xuất phục vụ tìm kiếm toàn văn</text>
        <text x="20" y="60" fill="#475569" font-size="11">⚙️ Document Classifier: Thuật toán so khớp gán Tag, Correspondent, Document Type tự động</text>
        <text x="20" y="76" fill="#475569" font-size="11">📁 Consumable Ingestion: Theo dõi thư mục consume để tự động nạp tài liệu mới</text>
      </g>
    </g>

    <!-- CONTAINER 2: paperless-db (PostgreSQL) -->
    <g transform="translate(315, 470)">
      <rect x="0" y="0" width="250" height="265" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="250" height="36" rx="10" fill="#0d9488"/>
      <text x="15" y="24" fill="#ffffff" font-size="13" font-weight="bold">🗄️ Container 2: paperless-db</text>
      <text x="235" y="23" text-anchor="end" fill="#ccfbf1" font-size="10">postgres:16-alpine</text>

      <g transform="translate(15, 48)">
        <rect x="0" y="0" width="220" height="40" rx="5" fill="#f0fdfa" stroke="#5eead4"/>
        <text x="110" y="18" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">PostgreSQL 16 Engine</text>
        <text x="110" y="32" text-anchor="middle" fill="#134e4a" font-size="10">Port nội bộ: 5432</text>

        <text x="0" y="60" fill="#334155" font-size="11" font-weight="bold">Lưu trữ các bảng dữ liệu:</text>
        <rect x="0" y="68" width="220" height="135" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="88" fill="#475569" font-size="10">• documents_document</text>
        <text x="10" y="106" fill="#475569" font-size="10">• documents_tag</text>
        <text x="10" y="124" fill="#475569" font-size="10">• documents_correspondent</text>
        <text x="10" y="142" fill="#475569" font-size="10">• documents_documenttype</text>
        <text x="10" y="160" fill="#475569" font-size="10">• auth_user &amp; authtoken_token</text>
        <text x="10" y="178" fill="#475569" font-size="10">• celery_taskmeta (trạng thái task)</text>
      </g>
    </g>

    <!-- CONTAINER 3: paperless-broker (Redis) -->
    <g transform="translate(595, 470)">
      <rect x="0" y="0" width="250" height="265" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="250" height="36" rx="10" fill="#dc2626"/>
      <text x="15" y="24" fill="#ffffff" font-size="13" font-weight="bold">⚡ Container 3: paperless-broker</text>
      <text x="235" y="23" text-anchor="end" fill="#fee2e2" font-size="10">redis:7-alpine</text>

      <g transform="translate(15, 48)">
        <rect x="0" y="0" width="220" height="40" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="110" y="18" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="bold">Redis 7 In-Memory Store</text>
        <text x="110" y="32" text-anchor="middle" fill="#7f1d1d" font-size="10">Port nội bộ: 6379</text>

        <text x="0" y="60" fill="#334155" font-size="11" font-weight="bold">Vai trò trong kiến trúc:</text>
        <rect x="0" y="68" width="220" height="135" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="88" fill="#475569" font-size="10">• Hàng đợi tác vụ (Message Broker)</text>
        <text x="10" y="106" fill="#475569" font-size="10">• Nhận job upload từ webserver</text>
        <text x="10" y="124" fill="#475569" font-size="10">• Điều phối hàng đợi Celery tasks</text>
        <text x="10" y="142" fill="#475569" font-size="10">• Bộ đệm kết quả xử lý trung gian</text>
        <text x="10" y="160" fill="#475569" font-size="10">• Đảm bảo bất đồng bộ không chặn</text>
        <text x="10" y="178" fill="#475569" font-size="10">• Chống nghẽn tiến trình API</text>
      </g>
    </g>
  </g>

  <!-- ==================== KHỐI LƯU TRỮ PERSISTENT VOLUMES ==================== -->
  <g id="volumes" transform="translate(895, 100)">
    <rect x="0" y="0" width="265" height="660" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="265" height="40" rx="12" fill="#475569"/>
    <text x="132" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💾 PERSISTENT VOLUMES</text>

    <!-- Volume 1: media -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="235" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="24" rx="8" fill="#e2e8f0"/>
      <text x="10" y="17" fill="#1e293b" font-size="11" font-weight="bold">📁 volume: media</text>
      <text x="10" y="42" fill="#475569" font-size="10">Gắn vào: /usr/src/paperless/media</text>
      <text x="10" y="60" fill="#334155" font-size="10">• Tài liệu gốc (PDF/Text/Image)</text>
      <text x="10" y="78" fill="#334155" font-size="10">• File PDF đã qua xử lý OCR</text>
      <text x="10" y="94" fill="#334155" font-size="10">• Ảnh thumbnail thu nhỏ</text>
    </g>

    <!-- Volume 2: data -->
    <g transform="translate(15, 180)">
      <rect x="0" y="0" width="235" height="85" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="24" rx="8" fill="#e2e8f0"/>
      <text x="10" y="17" fill="#1e293b" font-size="11" font-weight="bold">📁 volume: data</text>
      <text x="10" y="42" fill="#475569" font-size="10">Gắn vào: /usr/src/paperless/data</text>
      <text x="10" y="60" fill="#334155" font-size="10">• Whoosh index files</text>
      <text x="10" y="78" fill="#334155" font-size="10">• Cấu hình và cache nội bộ</text>
    </g>

    <!-- Volume 3: pgdata -->
    <g transform="translate(15, 285)">
      <rect x="0" y="0" width="235" height="85" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="24" rx="8" fill="#ccfbf1"/>
      <text x="10" y="17" fill="#0f766e" font-size="11" font-weight="bold">🗄️ volume: pgdata</text>
      <text x="10" y="42" fill="#134e4a" font-size="10">Gắn vào: /var/lib/postgresql/data</text>
      <text x="10" y="60" fill="#334155" font-size="10">• Toàn bộ dữ liệu PostgreSQL</text>
      <text x="10" y="78" fill="#334155" font-size="10">• Indexes &amp; Transaction logs</text>
    </g>

    <!-- Volume 4: redisdata -->
    <g transform="translate(15, 390)">
      <rect x="0" y="0" width="235" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="24" rx="8" fill="#fee2e2"/>
      <text x="10" y="17" fill="#b91c1c" font-size="11" font-weight="bold">⚡ volume: redisdata</text>
      <text x="10" y="42" fill="#7f1d1d" font-size="10">Gắn vào: /data (Redis dump.rdb)</text>
      <text x="10" y="60" fill="#334155" font-size="10">• Lưu trạng thái hàng đợi nền</text>
      <text x="10" y="78" fill="#334155" font-size="10">• Đảm bảo task không mất khi restart</text>
    </g>

    <!-- Host mounts: consume & export -->
    <g transform="translate(15, 495)">
      <rect x="0" y="0" width="235" height="145" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="24" rx="8" fill="#e2e8f0"/>
      <text x="10" y="17" fill="#334155" font-size="11" font-weight="bold">📂 Host Bind Mounts (Thư mục máy)</text>
      <text x="10" y="45" fill="#1e293b" font-size="10" font-weight="bold">• ./consume:</text>
      <text x="20" y="62" fill="#475569" font-size="10">Thả file vào đây để tự động nạp</text>
      <text x="10" y="85" fill="#1e293b" font-size="10" font-weight="bold">• ./export:</text>
      <text x="20" y="102" fill="#475569" font-size="10">Thư mục xuất sao lưu tài liệu</text>
      <text x="10" y="125" fill="#0284c7" font-size="10" font-weight="bold">• .env / secrets:</text>
      <text x="20" y="139" fill="#475569" font-size="10">Biến môi trường và cấu hình mật</text>
    </g>
  </g>

  <!-- ==================== ĐƯỜNG KẾT NỐI & TƯƠNG TÁC (ARROWS) ==================== -->
  
  <!-- [1] Clients -> Webserver (HTTP 8000) -->
  <path d="M 240 230 L 315 230" fill="none" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="245" y="210" width="65" height="18" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="277" y="223" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="bold">HTTP:8000</text>

  <path d="M 240 430 L 275 430 L 275 270 L 315 270" fill="none" stroke="#7e22ce" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="245" y="340" width="60" height="28" rx="3" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="275" y="352" text-anchor="middle" fill="#7e22ce" font-size="9" font-weight="bold">REST API</text>
  <text x="275" y="364" text-anchor="middle" fill="#7e22ce" font-size="8">Auth Token</text>

  <!-- [2] Webserver <-> Database (TCP 5432) -->
  <path d="M 440 430 L 440 470" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 435 470 L 435 430" fill="none" stroke="#0d9488" stroke-width="2"/>
  <rect x="385" y="440" width="110" height="20" rx="4" fill="#ffffff" stroke="#5eead4"/>
  <text x="440" y="454" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="bold">PostgreSQL :5432</text>

  <!-- [3] Webserver <-> Redis Broker (TCP 6379) -->
  <path d="M 720 430 L 720 470" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M 715 470 L 715 430" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="670" y="440" width="100" height="20" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="720" y="454" text-anchor="middle" fill="#b91c1c" font-size="10" font-weight="bold">Redis :6379</text>

  <!-- [4] Webserver -> Media / Data Volumes -->
  <path d="M 845 230 L 895 230" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <rect x="850" y="215" width="40" height="15" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="870" y="226" text-anchor="middle" fill="#475569" font-size="8" font-weight="bold">Mount</text>

  <!-- [5] DB -> pgdata Volume -->
  <path d="M 565 590 L 895 330" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>

  <!-- [6] Redis -> redisdata Volume -->
  <path d="M 845 590 L 895 435" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>

</svg>
